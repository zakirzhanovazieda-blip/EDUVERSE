name: Deploy EDUVERSE to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'EDUVERSE-source.zip'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q EDUVERSE-source.zip -d source
      - name: Find project
        run: echo "PROJECT_DIR=$(dirname $(find source -name package.json -print -quit))" >> $GITHUB_ENV
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/**/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ env.PROJECT_DIR }}
      - run: pnpm build --base=/EDUVERSE/
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
